server:
  port: ${PORT:5000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

studioops:
  beta:
    whatsapp-only: ${STUDIOOPS_BETA_WHATSAPP_ONLY:true}
  ses-sandbox-verification:
    enabled: ${STUDIOOPS_SES_SANDBOX_VERIFICATION_ENABLED:false}
  cors:
    allowed-origins: ${STUDIOOPS_CORS_ALLOWED_ORIGINS:https://beta.studioops.photo}
  email:
    enabled: ${STUDIOOPS_EMAIL_ENABLED:false}
    from: ${STUDIOOPS_EMAIL_FROM:no-reply@studioops.photo}
    from-name: ${STUDIOOPS_EMAIL_FROM_NAME:StudioOps Beta}
  frontend-url: ${STUDIOOPS_FRONTEND_URL:https://beta.studioops.photo}
  platform-admin:
    notifications:
      enabled: ${STUDIOOPS_PLATFORM_ADMIN_NOTIFICATIONS_ENABLED:true}
      email: ${STUDIOOPS_PLATFORM_ADMIN_EMAIL:}
    emails: ${STUDIOOPS_PLATFORM_ADMIN_EMAILS:a.fayaaz@gmail.com}
