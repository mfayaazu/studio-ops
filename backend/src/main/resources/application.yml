server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/studioops
    username: studioops
    password: studioops_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

studioops:
  beta:
    whatsapp-only: true
  email:
    enabled: false
    from: no-reply@studioops.photo
  frontend-url: ${STUDIOOPS_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${STUDIOOPS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

