name: Deploy Beta to Free-Tier EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.beta.yml'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-beta.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # 2. Build Backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build Backend Package
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Package Deployment Assets
      - name: Create Deploy Directory and Bundle
        run: |
          mkdir -p deploy/backend/target
          mkdir -p deploy/frontend/dist
          mkdir -p deploy/scripts/deploy

          # Copy backend files
          cp backend/Dockerfile.beta deploy/backend/
          cp backend/target/backend-0.0.1-SNAPSHOT.jar deploy/backend/target/

          # Copy frontend files
          cp frontend/Dockerfile.beta deploy/frontend/
          cp frontend/nginx.beta.conf deploy/frontend/
          cp -r frontend/dist/* deploy/frontend/dist/

          # Copy config and scripts
          cp docker-compose.beta.yml deploy/
          cp scripts/deploy/fetch-ssm-env.sh deploy/scripts/deploy/
          cp scripts/deploy/deploy-ec2.sh deploy/scripts/deploy/

          # Compress deployment package
          cd deploy
          tar -czf ../deploy-package.tar.gz .

      # 4. Configure AWS Credentials via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Upload Deployment Bundle to S3
      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy-package.tar.gz s3://${{ secrets.DEPLOY_BUCKET }}/deployments/${{ github.sha }}/deploy-package.tar.gz

      # 6. Execute Remote Deployment via SSM Run Command
      - name: Execute remote deployment via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=[
              "mkdir -p /home/ubuntu/studio-ops",
              "mkdir -p /home/ubuntu/studio-ops-temp",
              "aws s3 cp s3://${{ secrets.DEPLOY_BUCKET }}/deployments/${{ github.sha }}/deploy-package.tar.gz /home/ubuntu/studio-ops-temp/deploy-package.tar.gz",
              "cd /home/ubuntu/studio-ops",
              "tar -xzf /home/ubuntu/studio-ops-temp/deploy-package.tar.gz -C .",
              "rm -f /home/ubuntu/studio-ops-temp/deploy-package.tar.gz",
              "chmod +x scripts/deploy/deploy-ec2.sh",
              "./scripts/deploy/deploy-ec2.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          
          # Poll command invocation status
          echo "Polling SSM Command execution status..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              echo "=== Standard Error Logs ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              echo "=== Standard Output Logs ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi
            sleep 10
          done

      # 7. External Verification
      - name: Verify external domain health check
        run: |
          echo "Verifying external domain health check..."
          if curl -s -f http://beta.infinotiveitkonsult.se/api/health > /dev/null; then
            echo "External Health Check PASSED: http://beta.infinotiveitkonsult.se/api/health is UP."
          else
            echo "External Health Check WARNING: Could not access health check externally."
          fi
