name: Deploy Beta to Free-Tier EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.beta.yml'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-beta.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # 2. Build Backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build Backend Package
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Package Deployment Assets
      - name: Create Deploy Directory and Bundle
        run: |
          mkdir -p deploy/backend/target
          mkdir -p deploy/frontend/dist
          mkdir -p deploy/scripts/deploy

          # Copy backend files
          cp backend/Dockerfile.beta deploy/backend/
          cp backend/target/backend-0.0.1-SNAPSHOT.jar deploy/backend/target/

          # Copy frontend files
          cp frontend/Dockerfile.beta deploy/frontend/
          cp frontend/nginx.beta.conf deploy/frontend/
          cp -r frontend/dist/* deploy/frontend/dist/

          # Copy config and scripts
          cp docker-compose.beta.yml deploy/
          cp scripts/deploy/fetch-ssm-env.sh deploy/scripts/deploy/
          cp scripts/deploy/run-deploy.sh deploy/scripts/deploy/

          # Compress deployment package
          cd deploy
          tar -czf ../deploy-package.tar.gz .

      # 4. Configure AWS Credentials via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Upload Assets to AWS S3
      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy-package.tar.gz s3://${{ secrets.DEPLOY_BUCKET }}/deployments/${{ github.sha }}/deploy-package.tar.gz

      # 6. Trigger EC2 Deployment via SSM Run Command
      - name: Trigger EC2 Deployment via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --comment "Deploying commit ${{ github.sha }} to beta environment" \
            --parameters '{"commands":[
              "mkdir -p /home/ubuntu/studio-ops /home/ubuntu/studio-ops-temp",
              "aws s3 cp s3://${{ secrets.DEPLOY_BUCKET }}/deployments/${{ github.sha }}/deploy-package.tar.gz /home/ubuntu/studio-ops-temp/deploy-package.tar.gz",
              "cd /home/ubuntu/studio-ops",
              "tar -xzf /home/ubuntu/studio-ops-temp/deploy-package.tar.gz -C .",
              "rm -f /home/ubuntu/studio-ops-temp/deploy-package.tar.gz",
              "chmod +x scripts/deploy/run-deploy.sh",
              "./scripts/deploy/run-deploy.sh"
            ]}' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Run Command triggered successfully."
          echo "Command ID: $CMD_ID"
          echo "CMD_ID=$CMD_ID" >> $GITHUB_ENV

      # 7. Poll SSM Command Execution Status and Output Logs
      - name: Poll SSM Command Execution Status
        run: |
          echo "Polling status for SSM Command ID: ${{ env.CMD_ID }}"
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ env.CMD_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Deployment Command completed successfully!"
              echo "=== Command Execution Standard Output ==="
              aws ssm get-command-invocation \
                --command-id "${{ env.CMD_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM Deployment Command FAILED with status: $STATUS"
              
              echo "=== Command Execution Standard Output ==="
              aws ssm get-command-invocation \
                --command-id "${{ env.CMD_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              
              echo "=== Command Execution Standard Error ==="
              aws ssm get-command-invocation \
                --command-id "${{ env.CMD_ID }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              
              exit 1
            fi
            sleep 10
          done
