name: Deploy Beta to Free-Tier EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.beta.yml'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: https://beta.infinitoshutters.se
        run: |
          cd frontend
          npm run build

      # 2. Build Backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build Backend Package
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 3. Package Deployment Assets
      - name: Create Deploy Directory and Bundle
        run: |
          mkdir -p deploy/backend/target
          mkdir -p deploy/frontend/dist
          mkdir -p deploy/scripts/deploy

          # Copy backend files
          cp backend/Dockerfile.beta deploy/backend/
          cp backend/target/backend-0.0.1-SNAPSHOT.jar deploy/backend/target/

          # Copy frontend files
          cp frontend/Dockerfile.beta deploy/frontend/
          cp frontend/nginx.beta.conf deploy/frontend/
          cp -r frontend/dist/* deploy/frontend/dist/

          # Copy config and scripts
          cp docker-compose.beta.yml deploy/
          cp scripts/deploy/fetch-ssm-env.sh deploy/scripts/deploy/

          # Compress deployment package
          cd deploy
          tar -czf ../deploy-package.tar.gz .

      # 4. Upload Assets to EC2
      - name: Copy deployment package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-package.tar.gz"
          target: "/home/${{ secrets.EC2_USERNAME }}/studio-ops-temp"

      # 5. SSH to EC2 and Execute Deployment
      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Prepare deployment directory
            mkdir -p /home/${{ secrets.EC2_USERNAME }}/studio-ops
            cd /home/${{ secrets.EC2_USERNAME }}/studio-ops

            # Extract new package
            tar -xzf /home/${{ secrets.EC2_USERNAME }}/studio-ops-temp/deploy-package.tar.gz -C .
            rm -f /home/${{ secrets.EC2_USERNAME }}/studio-ops-temp/deploy-package.tar.gz

            # Generate environment config from SSM Parameter Store
            chmod +x scripts/deploy/fetch-ssm-env.sh
            ./scripts/deploy/fetch-ssm-env.sh

            # Spin up containers
            docker compose -f docker-compose.beta.yml down --remove-orphans
            docker compose -f docker-compose.beta.yml up -d --build

            # Wait for backend initialization and run Smoke test
            echo "Waiting for backend to start up..."
            sleep 15
            if curl -s -f http://localhost:8080/api/health > /dev/null; then
              echo "Smoke Test PASSED: Backend is healthy and responding."
            else
              echo "Smoke Test WARNING: Backend health check failed on localhost:8080."
              docker compose -f docker-compose.beta.yml logs backend --tail 30
            fi
